name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    name: Rust core and CLI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy

      - name: Select Rust toolchain
        run: rustup default 1.97.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: core-cli

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy -p llamask-core -p llamask --all-targets -- -D warnings

      - name: Run tests
        run: cargo test -p llamask-core -p llamask --no-fail-fast

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal

      - name: Select Rust toolchain
        run: rustup default 1.97.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: desktop-${{ matrix.os }}

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/llamask-desktop/pnpm-lock.yaml

      - name: Install desktop dependencies
        working-directory: apps/llamask-desktop
        run: pnpm install --frozen-lockfile

      - name: Test offline runtime packager
        run: python scripts/tests/test_prepare_desktop_runtime.py

      - name: Check desktop TypeScript
        working-directory: apps/llamask-desktop
        run: pnpm check

      - name: Build desktop frontend
        working-directory: apps/llamask-desktop
        run: pnpm build

      - name: Test desktop Rust crate
        run: cargo test -p llamask-desktop --no-fail-fast
