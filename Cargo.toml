[workspace]
resolver = "2"
members = [
    "apps/llamask-cli",
    "apps/llamask-desktop/src-tauri",
    "crates/llamask-core",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"

[workspace.dependencies]
base64 = "0.22.1"
clap = { version = "4.5.50", features = ["derive"] }
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png"] }
quick-xml = "0.41.0"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
